# File: compose.yaml
# Purpose: Loopback-only Docker Ollama service and persistent model volume.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23

services:
  ollama:
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped
volumes:
  ollama_models:
