# File: .github/workflows/tests.yml
# Purpose: Cross-platform regression, consistency and isolated package-install checks.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23

name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check village scripts tests
      - run: python -m ruff format --check village scripts tests
      - run: python scripts/check_consistency.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q village scripts tests
      - run: python scripts/check_contributor_contracts.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/check_wheel_install.py --wheel-directory dist
