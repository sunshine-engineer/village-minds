# File: pyproject.toml
# Purpose: Build metadata, runtime dependencies and developer tooling.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "village-minds"
version = "0.1.0"
description = "A Panda3D village with local AI villagers and player possession"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["panda3d==1.10.16"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.urls]
Repository = "https://github.com/sunshine-engineer/village-minds"
Issues = "https://github.com/sunshine-engineer/village-minds/issues"

[project.scripts]
village-minds = "village.__main__:main"
village-evaluate = "village.evaluation:main"
village-server = "village.server:main"
village-client = "village.client:main"

[tool.setuptools.packages.find]
include = ["village*"]

[tool.setuptools.package-data]
village = ["data/*.json", "data/prompts/*.txt", "data/assets/*", "data/assets/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["village/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D201", "D202", "D209", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Directly executable helpers add the checkout to sys.path before package imports.
"scripts/*.py" = ["E402"]
